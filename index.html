<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Just One Day — vertical slice</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#141210;--stage:#0b0a09;--ink:#f4ecdc;--mute:#b3a794;--line:rgba(244,236,220,.18);--warm:#e8b25a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141210;--stage:#0b0a09;--ink:#f4ecdc;--mute:#b3a794;--line:rgba(244,236,220,.18)}}
:root[data-theme="dark"]{--bg:#141210;--stage:#0b0a09;--ink:#f4ecdc;--mute:#b3a794;--line:rgba(244,236,220,.18)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Work Sans",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:8px}
#frame{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--stage);overflow:hidden;border-radius:4px;cursor:pointer;user-select:none}
#scene{position:absolute;inset:0;transition:opacity .9s}
#scene svg{width:100%;height:100%;display:block;animation:drift 24s ease-out forwards;transform-origin:55% 60%}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.08)}}
#scene.late svg{filter:sepia(.55) saturate(1.15) hue-rotate(-18deg) brightness(.72) contrast(1.12)}
#scene.late::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 75% 20%,rgba(255,140,60,.35),transparent 60%),linear-gradient(rgba(120,70,30,.25),rgba(40,20,10,.35))}
#stage.glitch #scene{animation:gl .7s steps(8) 1}
@keyframes gl{0%{transform:translateX(0)}15%{transform:translateX(-3%);filter:hue-rotate(90deg)}30%{transform:translateX(2%) skewX(4deg)}50%{transform:translateX(-1%);filter:invert(.15)}70%{transform:translateX(4%)}100%{transform:none}}
#stamp{position:absolute;left:4%;top:5%;font:500 12px "Work Sans";letter-spacing:.06em;color:var(--ink);opacity:0;transition:opacity .8s;text-shadow:0 1px 6px #000}
#stamp.on{opacity:.85}
#sub{position:absolute;left:0;right:0;bottom:0;padding:5% 9% 4%;background:linear-gradient(transparent,rgba(0,0,0,.78));text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
#sub.on{opacity:1}
#sub b{display:block;font:500 11px "Work Sans";color:var(--warm);margin-bottom:2px}
#sub p{margin:0 auto;max-width:34em;font:500 clamp(16px,2.6vw,27px)/1.35 "Cormorant Garamond",Georgia,serif}
#sub.Narrator p{font-style:italic}
#sub.Fact p{font:400 clamp(12px,1.6vw,15px)/1.45 "Work Sans",sans-serif;color:var(--mute)}
#sub.off{display:none}
#hint{position:absolute;right:3%;bottom:3%;font-size:11px;color:var(--mute);opacity:0;transition:opacity .4s}
#hint.on{opacity:.9}
#black{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .8s;display:flex;align-items:center;justify-content:center;pointer-events:none}
#black.on{opacity:1}
#year{font:500 clamp(56px,13vw,150px)/1 "Cormorant Garamond",serif;font-variant-numeric:tabular-nums}
#choice{position:absolute;left:5%;right:5%;bottom:6%;display:none;flex-direction:column;align-items:center;gap:12px;cursor:default}
#choice.on{display:flex}
#choice .q{font:italic 500 clamp(16px,2.4vw,24px) "Cormorant Garamond",serif;text-shadow:0 1px 8px #000}
#choice .opts{display:flex;gap:14px;width:100%;justify-content:center;flex-wrap:wrap}
#choice button{flex:1 1 220px;max-width:340px;text-align:left;background:rgba(15,12,9,.72);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:12px 16px;font:500 15px "Work Sans";cursor:pointer;backdrop-filter:blur(6px);transition:border-color .2s,background .2s,transform .2s}
#choice button small{display:block;color:var(--mute);font-weight:400;margin-top:2px}
#choice button:hover,#choice button:focus-visible{border-color:var(--warm);background:rgba(40,30,18,.85);transform:translateY(-2px);outline:none}
#card{position:absolute;inset:0;background:var(--stage);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:6%;cursor:default}
#card.on{display:flex}
#card h1{margin:0;font:500 clamp(34px,7vw,76px)/1 "Cormorant Garamond",serif}
#card p{margin:0;color:var(--mute);max-width:34em}
#card .tag{font:italic 500 clamp(16px,2.4vw,24px) "Cormorant Garamond",serif;color:var(--ink)}
#card code{font:12px ui-monospace,Menlo,monospace;color:var(--warm);background:rgba(255,255,255,.06);padding:6px 10px;border-radius:3px}
.btn{background:var(--warm);color:#1a1209;border:0;border-radius:3px;padding:10px 22px;font:500 15px "Work Sans";cursor:pointer}
.btn:focus-visible,.bar button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar button{background:transparent;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:6px 12px;font:400 13px "Work Sans";cursor:pointer}
.bar button[aria-pressed="false"]{text-decoration:line-through}
.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(4px,-3px)}50%{transform:translate(-2px,-5px)}75%{transform:translate(3px,1px)}100%{transform:translate(0,0)}}
.hs{position:absolute;z-index:20;width:30px;height:30px;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer}.hs::after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--ink);opacity:.55;box-shadow:0 0 8px var(--warm);animation:flick 2.4s infinite}.hs:hover::after,.hs:focus-visible::after{opacity:1;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;animation:none}.hs.used::after{opacity:.18;animation:none;box-shadow:none}.hs:focus-visible{outline:none}
#thought{position:absolute;left:50%;top:9%;transform:translate(-50%,-8px);max-width:80%;text-align:center;font:italic 500 clamp(15px,2.2vw,22px) 'Cormorant Garamond',Georgia,serif;color:#fff;text-shadow:0 1px 8px #000;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;z-index:36}#thought.on{opacity:1;transform:translate(-50%,0)}
.tiny{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:36;background:rgba(15,12,9,.78);color:var(--ink);border:1px solid var(--warm);border-radius:20px;padding:7px 16px;font:500 13px 'Work Sans',sans-serif;cursor:pointer;opacity:0;transition:opacity .5s}.tiny.on{opacity:1}.tiny:hover{background:rgba(40,30,18,.9)}
.bar button.new::after{content:' ●';color:var(--warm)}
@media (prefers-reduced-motion:reduce){#scene svg,.fly{animation:none}#stage.glitch #scene{animation:none}}
</style>
</head>
<body>
<div id="frame"><div id="stage" aria-live="polite">
  <div id="scene"></div>
  <div id="stamp"></div>
  <div id="sub"><b></b><p></p></div>
  <div id="hint">Click or press Space to continue</div>
  <div id="choice"><div class="q"></div><div class="opts"></div></div>
  <div id="black"><div id="year"></div></div>
  <div id="card" class="on"><h1>Just One Day</h1><p class="tag">One ordinary day. Ten years of consequences.</p><p>A vertical slice: the prologue and the first decision. Sound on is recommended; subtitles are on by default.</p><button class="btn" id="go">Begin</button></div>
</div></div>
<div class="bar">
  <button id="snd" aria-pressed="true">Sound</button>
  <button id="vl">Volume</button>
  <button id="cc" aria-pressed="true">Subtitles</button>
  <button id="bg" aria-pressed="true">Big text</button>
  <button id="fsb">Fullscreen</button>
  <button id="ph">Phone</button>
  <button id="rs">Restart</button>
</div>
<script>
const $=s=>document.querySelector(s);
const stage=$('#stage'),sceneEl=$('#scene'),sub=$('#sub'),hint=$('#hint');
let run=0,waiter=null,A=null,master=null,soundOn=true;
const echo={};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const chk=t=>{if(t!==run)throw 'abort'};

/* ---------- audio (synthesised placeholders) ---------- */
let sfxBus=null,ambBus=null;
const VOL=Object.assign({master:1,music:1,sfx:1,amb:1},(()=>{try{return JSON.parse(localStorage.getItem('jod_vol'))||{}}catch(_){return{}}})());
function tone(f,d,type='sine',v=.08,at=0,slide){
  if(!A)return;const o=A.createOscillator(),g=A.createGain(),t=A.currentTime+at;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(sfxBus||master);o.start(t);o.stop(t+d+.05);
}
const sfx={
  alarm(){for(let i=0;i<6;i++)tone(1760,.12,'square',.04,i*.22)},
  pop(){tone(520,.12,'triangle',.1,0,260)},
  tick(){tone(1200,.03,'square',.03)},
  whoosh(){tone(90,1.2,'sawtooth',.05,0,700)},
  rewind(){for(let i=0;i<14;i++)tone(900-i*40,.05,'square',.025,i*.05)},
  hum(){tone(55,2.4,'sine',.07)}
};

/* ---------- generative indie background music ---------- */
const MU={timer:null,bus:null,lp:null,mood:'warm',step:0,t:0,noise:null};
const mf=m=>440*Math.pow(2,(m-69)/12);
const PROG={
 warm:[[48,[60,64,67,71]],[45,[57,60,64,67]],[41,[53,57,60,64]],[43,[55,59,62,64]]],
 dim:[[45,[57,60,64,67]],[41,[53,57,60,64]],[50,[57,62,65,69]],[40,[55,59,62,67]]]
};
const PENTA=[72,74,76,79,81,84];
function mt(f,d,type,v,at,att=.005){const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(v,at+att);g.gain.exponentialRampToValueAtTime(.0001,at+d);
 o.connect(g);g.connect(MU.lp);o.start(at);o.stop(at+d+.05)}
function kick(w){const o=A.createOscillator(),g=A.createGain();o.frequency.setValueAtTime(130,w);o.frequency.exponentialRampToValueAtTime(42,w+.14);g.gain.setValueAtTime(.16,w);g.gain.exponentialRampToValueAtTime(.0001,w+.18);o.connect(g);g.connect(MU.lp);o.start(w);o.stop(w+.2)}
function shk(w){const s=A.createBufferSource(),g=A.createGain(),h=A.createBiquadFilter();s.buffer=MU.noise;h.type='highpass';h.frequency.value=6500;g.gain.setValueAtTime(.025,w);g.gain.exponentialRampToValueAtTime(.0001,w+.05);s.connect(h);h.connect(g);g.connect(MU.lp);s.start(w);s.stop(w+.06)}
function musicSched(){
  const warm=MU.mood==='warm',ec=60/(warm?84:62)/2;
  while(MU.t<A.currentTime+.4){
    const s=MU.step%8,bar=Math.floor(MU.step/8)%4,[root,ch]=PROG[MU.mood][bar],w=MU.t;
    if(s===0){mt(mf(root),ec*7,'sine',warm?.2:.17,w,.02);ch.slice(0,3).forEach(n=>mt(mf(n),ec*8,'triangle',.018,w,.6))}
    if(warm&&(s===0||s===4))kick(w);
    if(warm&&s%2===1)shk(w);
    const pat={0:0,2:2,3:1,4:3,6:2,7:1};
    if(s in pat&&(warm||Math.random()<.55))mt(mf(ch[pat[s]]+(s===4?12:0)),ec*3,'triangle',warm?.075:.06,w+(Math.random()-.5)*.012);
    if(s===4&&Math.random()<(warm?.45:.3))mt(mf(PENTA[Math.floor(Math.random()*6)]),ec*5,'sine',.05,w,.01);
    MU.t+=ec;MU.step++;
  }
}
function musicStop(){if(MU.timer){clearInterval(MU.timer);MU.timer=null}if(MU.bus){const b=MU.bus;b.gain.setTargetAtTime(0,A.currentTime,.15);setTimeout(()=>b.disconnect(),900)}}
function musicStart(){musicStop();MU.bus=A.createGain();MU.lp=A.createBiquadFilter();MU.lp.type='lowpass';MU.lp.frequency.value=3600;MU.bus.gain.value=.55*VOL.music;MU.lp.connect(MU.bus);MU.bus.connect(master);
 const n=A.sampleRate;MU.noise=A.createBuffer(1,n>>2,n);const d=MU.noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 MU.mood='warm';MU.step=0;MU.t=A.currentTime+.3;MU.timer=setInterval(musicSched,100)}
function setMood(m){MU.mood=m;if(MU.lp)MU.lp.frequency.setTargetAtTime(m==='warm'?3600:1300,A.currentTime,.6)}
let base=1,duck=1;
function musicApply(){if(MU.bus)MU.bus.gain.setTargetAtTime(.55*base*duck*VOL.music,A.currentTime,.4)}
function musicLevel(v){base=v;musicApply()}

/* ---------- SVG placeholder art (match-cut ready) ---------- */
const svg=(b)=>`<svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">${b}</svg>`;
const alex=(x,y)=>`<g transform="translate(${x} ${y})"><circle cx="0" cy="0" r="5" fill="#d9a77c"/><path d="M-5 -2q5 -7 10 0z" fill="#2a1d14"/><rect x="-6" y="5" width="12" height="20" rx="4" fill="#2f4a6b"/><rect x="-5" y="25" width="4" height="12" fill="#25364f"/><rect x="1" y="25" width="4" height="12" fill="#25364f"/></g>`;
function bedroom(){return svg(`
<defs><linearGradient id="bw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1d6a4"/><stop offset="1" stop-color="#d7b07a"/></linearGradient>
<radialGradient id="lg"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/></radialGradient></defs>
<rect width="160" height="90" fill="url(#bw)"/><rect y="70" width="160" height="20" fill="#6a4932"/>
<rect x="12" y="10" width="30" height="38" fill="#cfe6f0"/><path d="M12 10h30v38H12z M27 10v38 M12 29h30" stroke="#8a6a4a" stroke-width="1.5" fill="none"/>
<path d="M8 8h10l-3 44H8z M46 8H36l3 44h7z" fill="#b9553c" opacity=".85"/>
<polygon points="14,48 42,48 74,86 6,86" fill="#fff6c8" opacity=".25"/>
<rect x="92" y="9" width="40" height="11" rx="2" fill="#f3f3ee" stroke="#c9c6bb"/><path d="M98 24q3 3 6 0t6 0t6 0t6 0" stroke="#8cc4e6" fill="none" stroke-width="1"/>
<rect x="72" y="52" width="80" height="22" rx="3" fill="#5d7fa8"/><rect x="74" y="50" width="22" height="8" rx="3" fill="#f1ede4"/><rect x="108" y="62" width="4" height="7" rx="1" fill="#222"/><rect x="108.5" y="62.5" width="3" height="6" fill="#7fd0ff"/>
<rect x="14" y="56" width="18" height="16" fill="#7a5a3c"/><path d="M12 56q8 -8 20 0l-3 6h-14z" fill="#c75b5b"/><path d="M16 52q6 -4 12 0" stroke="#4a78a8" stroke-width="3" fill="none"/>
<circle cx="58" cy="58" r="12" fill="url(#lg)"/><rect x="56" y="58" width="4" height="12" fill="#6a4932"/><path d="M52 58l4-7h4l4 7z" fill="#f6d27a"/>
${alex(100,48)}`)}
function kitchen(v,late){
  const tab=`<rect x="36" y="56" width="88" height="5" fill="#8a5a3a"/><rect x="40" y="61" width="4" height="22" fill="#6d4630"/><rect x="116" y="61" width="4" height="22" fill="#6d4630"/>`;
  let it='';
  if(!late){
    if(v==='food_waste')it=`<rect x="48" y="42" width="24" height="14" rx="2" fill="#c0392b"/><rect x="76" y="38" width="30" height="18" rx="2" fill="#d35400"/><rect x="109" y="44" width="12" height="12" rx="2" fill="#e67e22"/><circle cx="90" cy="45" r="4" fill="#f5d27a"/>`;
    else if(v==='disposable_packaging')it=`<rect x="50" y="36" width="7" height="20" rx="2" fill="#bfe6f2"/><rect x="60" y="38" width="7" height="18" rx="2" fill="#bfe6f2"/><ellipse cx="86" cy="50" rx="12" ry="7" fill="#f3f0e8"/><rect x="100" y="44" width="16" height="12" fill="#e9e4d8"/><path d="M72 56l14-14 M76 56l14-14" stroke="#ddd" stroke-width="1.2"/>`;
    else it=`<ellipse cx="80" cy="53" rx="12" ry="3" fill="#eee"/>`;
  }else{
    if(v==='food_waste')it=`<path d="M38 56Q54 22 80 30Q106 20 124 56Z" fill="#4e4126"/><circle cx="62" cy="42" r="5" fill="#6b7a3a"/><circle cx="92" cy="36" r="6" fill="#8a8a7a"/><circle cx="108" cy="46" r="4" fill="#7a3a2a"/><circle cx="76" cy="48" r="4" fill="#9a8a4a"/>${[0,1,2,3,4].map(i=>`<circle class="fly" style="animation-delay:-${i*.6}s" cx="${60+i*12}" cy="${24+(i%2)*6}" r="1" fill="#111"/>`).join('')}`;
    else it=`<path d="M34 56Q56 30 80 36Q108 28 128 56Z" fill="#7ea2b4" opacity=".9"/>${[0,1,2,3,4,5,6].map(i=>`<rect x="${42+i*11}" y="${34+(i%3)*5}" width="6" height="14" rx="2" fill="#cfe9f4" transform="rotate(${i*23-60} ${45+i*11} 44)"/>`).join('')}<ellipse cx="136" cy="80" rx="10" ry="4" fill="#e9e4d8"/><ellipse cx="26" cy="82" rx="9" ry="3" fill="#e9e4d8"/>`;
  }
  return svg(`
<defs><linearGradient id="kw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${late?'#e8c38e':'#f3d9a8'}"/><stop offset="1" stop-color="#d9b27c"/></linearGradient></defs>
<rect width="160" height="90" fill="url(#kw)"/><rect y="70" width="160" height="20" fill="#6b4a32"/>
<rect x="104" y="10" width="42" height="30" fill="${late?'#e9b27a':'#c6e5f3'}"/><path d="M104 10h42v30h-42z M125 10v30 M104 25h42" stroke="#8a6a4a" stroke-width="1.5" fill="none"/>
<rect x="0" y="44" width="30" height="26" fill="#b78d5e"/><rect x="0" y="42" width="30" height="3" fill="#d9c7a8"/>
${tab}${it}${late?'':alex(20,34)}`)}

/* ---------- engine ---------- */
function click(){return new Promise(r=>{waiter=r;hint.classList.add('on')})}
function advance(){if(waiter){const w=waiter;waiter=null;hint.classList.remove('on');w()}}
stage.addEventListener('click',e=>{if(e.target.closest('#choice,#card,#plog'))return;advance()});
document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){if($('#plog')||/^(BUTTON|INPUT)$/.test(document.activeElement.tagName))return;e.preventDefault();advance()}});

async function setScene(html,stamp,late,t){
  clearHS();sceneEl.style.opacity=0;$('#stamp').classList.remove('on');await sleep(650);chk(t);
  sceneEl.className=late?'late':'';sceneEl.innerHTML=html;sceneEl.style.opacity=1;
  $('#stamp').textContent=stamp;$('#stamp').classList.add('on');await sleep(500);chk(t);
}
function swapItems(html,late){sceneEl.innerHTML=html;sceneEl.className=late?'late':''}
async function line(who,text,t){
  sub.className=who;sub.querySelector('b').textContent=who==='Fact'?'':who;sub.querySelector('b').style.display=who==='Fact'?'none':'block';
  const p=sub.querySelector('p');
  const typed=(who==='Narrator'||who==='Fact')&&!matchMedia('(prefers-reduced-motion: reduce)').matches;
  p.textContent=text;
  if(!$('#cc').dataset.off)sub.classList.add('on');else sub.classList.add('off');
  if(typed){
    const s1=document.createElement('span'),s2=document.createElement('span');s2.style.opacity=0;p.textContent='';p.append(s1,s2);
    await new Promise(res=>{let i=0;s2.textContent=text;
      const iv=setInterval(()=>{i++;s1.textContent=text.slice(0,i);s2.textContent=text.slice(i);if(i>=text.length){clearInterval(iv);waiter=null;res()}},who==='Narrator'?45:18);
      waiter=()=>{clearInterval(iv);s1.textContent=text;s2.textContent='';res()};});
    chk(t);await sleep(300);chk(t);
  }
  await click();chk(t);sub.classList.remove('on');await sleep(250);chk(t);
}
function applyCC(){const off=$('#cc').getAttribute('aria-pressed')==='false';$('#cc').dataset.off=off?'1':'';sub.classList.toggle('off',off)}
function choose(id,q,opts,t){
  return new Promise(res=>{
    const c=$('#choice');c.querySelector('.q').textContent=q;
    const box=c.querySelector('.opts');box.innerHTML='';
    opts.forEach(o=>{const b=document.createElement('button');b.innerHTML=`${o.label}<small>${o.sub}</small>`;
      b.onclick=()=>{echo[id]=o.id;sfx.pop();if(HEAVY.has(o.id))addWeight(1);c.classList.remove('on');res(o.id)};box.appendChild(b)});
    c.classList.add('on');box.querySelector('button').focus({preventScroll:true});
  });
}
async function jump(t){
  const b=$('#black'),y=$('#year');sfx.whoosh();musicLevel(.3);$('#stamp').classList.remove('on');
  y.textContent=2026;b.classList.add('on');await sleep(900);chk(t);
  for(let n=2026;n<=2036;n++){y.textContent=n;sfx.tick();await sleep(n<2034?170:330);chk(t)}
  $('#stamp').textContent='A possible 2036';
  await sleep(500);chk(t);
}
async function rewind(t){
  stage.classList.add('glitch');sfx.rewind();await sleep(700);chk(t);stage.classList.remove('glitch');
}

/* ---------- story data ---------- */
const FUTURE={
  food_waste:{n:'What was left on the table didn’t simply disappear.',f:'Food thrown away and buried in landfill can release methane as it breaks down without air.'},

function censorFig(){

    await cancelOrder(t,lastBought.names);
    await line('Alex','“Cancelled. All of it.”',t);
    await line('Alex','“…Okay. Good.”',t);
    await line('Narrator','“Nothing was waiting for him. He made sure of it.”',t);
  }else{
    await line('Alex','“No boxes. The AC’s off. Nothing left on the table.”',t);
    await line('Alex','“…Okay. Good.”',t);
    await line('Narrator','“Nothing was waiting for him. That was the point.”',t);
  }
}

/* ===== EPILOGUE · THE NEXT MORNING (7:55 AM) ===== */
async function epilogue(t){
  dreamSub(false);
  setTint('rgba(255,230,190,.08)');ambience('street');
  await setScene(busStop(false,true),'2026 · 7:55 AM',false,t);
  await line('Alex','“Same street. Same bus. It was always right there.”',t);
  await choose('commute','Same stop. Same bus.',[
    {id:'bus_a',label:'Take the bus',sub:'It was always right there.'},
    {id:'bus_b',label:'Take the bus',sub:'From now on.'}],t);
  chk(t);
  await line('Alex','“Yeah. From now on.”',t);
  await setScene(busStop(false,false),'2026 · 8:00 AM',false,t);
  await sleep(1800);chk(t);
  await line('Narrator','“The bus was right there. It always had been.”',t);
}

/* ===== FINAL ACT · 2036 ===== */
function gate(){
  return svg(`${cityBg(true)}<rect x="4" y="30" width="3" height="28" fill="#6d4630"/><rect x="30" y="30" width="3" height="28" fill="#6d4630"/><rect x="4" y="30" width="29" height="3" fill="#6d4630"/>${busSvg}${carSvg(44,66,'#b04a3c')}<g transform="translate(82 49) scale(.5)">${alex(0,0)}</g>${haze}`)
}
const LAB={food_waste:'Ordered double and wasted half',disposable_packaging:'Single-use everything at breakfast',private_car:'Skipped the bus for a ride',extra_trip:'A ride, then a trip back for a forgotten kit',drink_delivery:'One cup, delivered across town',hot_shower:'A very long hot shower',cool_ac:'AC at 16°C with the door open',switch_off:'Turned everything off before going out',bus_a:'Took the bus, from then on',bus_b:'Took the bus, from then on',leave_on:'Left the console, TV and lights on',fast_fashion:'A pile of cheap tops in one night',few_items:'A couple of sale items',nothing:'Closed the app and went to bed',new_phone:'A new phone while the old one worked'};
async function finale(t){
  await setScene('<svg viewBox="0 0 16 9"></svg>','',false,t);
  const k=$('#card');
  const list=['breakfast','transportation','treat','leaving','upgrade','commute'].map(i=>`<li>${LAB[echo[i]]||''}</li>`).join('');
  k.innerHTML=`<h1>Just one day</h1><p class="tag">Nothing Alex did was dramatic.</p><ul style="list-style:none;padding:0;margin:0;color:var(--mute);line-height:1.9">${list}</ul><p>No single choice here causes a climate crisis. Repeated by millions of people, small habits add up.</p><button class="btn" id="again">Play again</button>`;
  k.classList.add('on');$('#again').onclick=start;
  await sleep(3200);chk(t);
  const n=document.createElement('div');n.className='ntf';
  n.style.cssText='position:absolute;left:50%;top:10px;transform:translate(-50%,-30px);opacity:0;z-index:35;width:min(320px,88%);background:rgba(18,20,28,.96);border:1px solid #2a3040;border-radius:12px;padding:9px 12px;font:400 13px "Work Sans",sans-serif;color:#e7eaf0;box-shadow:0 8px 24px rgba(0,0,0,.5);transition:transform .5s,opacity .5s;text-align:left';
  n.innerHTML=`<div style="color:#8a8f9c;font-size:10px;margin-bottom:2px">Messages · ${STR_NUM}</div>…thank you.`;
  stage.appendChild(n);requestAnimationFrame(()=>{n.style.transform='translate(-50%,0)';n.style.opacity=1});
  tone(1500,.07,'square',.04,0);tone(1500,.07,'square',.04,.14);
  logCall('msg','Now','“…thank you.”');
  await sleep(5200);chk(t);
  n.style.opacity=0;setTimeout(()=>n.remove(),600);
  await finalCall(t);chk(t);
  
}
async function start(){
  run++;const t=run;waiter&&advance();
  if(!A){A=new (window.AudioContext||window.webkitAudioContext)();master=A.createGain();master.gain.value=soundOn?VOL.master:0;master.connect(A.destination);sfxBus=A.createGain();sfxBus.gain.value=VOL.sfx;sfxBus.connect(master);ambBus=A.createGain();ambBus.gain.value=VOL.amb;ambBus.connect(master)}
  if(A.state==='suspended')A.resume();
  musicStart();ambience(null);
  Object.keys(echo).forEach(k=>delete echo[k]);addWeight(-99);document.querySelectorAll('.ntf').forEach(x=>x.remove());CALLS.length=0;clearHS();closeLog();
  $('#card').classList.remove('on');$('#choice').classList.remove('on');$('#black').classList.remove('on');
  sub.classList.remove('on');sceneEl.innerHTML='';applyCC();
  try{await story(t)}catch(e){if(e!=='abort')console.error(e)}
}
$('#go').onclick=start;
$('#rs').onclick=start;
/* ---------- volume mixer ---------- */
(()=>{
const ROWS=[['master','Master'],['music','Music'],['sfx','Effects'],['amb','Ambience']];
const ON='<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.2 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const OFF='<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const css=document.createElement('style');
css.textContent=`
#mix{position:fixed;z-index:60;display:none;width:min(264px,calc(100vw - 16px));background:rgba(20,18,15,.97);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px 10px;box-shadow:0 12px 32px rgba(0,0,0,.55);font:500 13px "Work Sans",system-ui,sans-serif}
#mix.on{display:block}
#mix h2{margin:0 0 4px;font:500 11px "Work Sans",system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
#mix .row{margin:8px 0 6px;transition:opacity .2s}
#mix .row.m{opacity:.55}
#mix .row:first-of-type{padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
#mix .top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
#mix .top span{flex:1}
#mix output{font:400 12px ui-monospace,Menlo,monospace;color:var(--mute);min-width:3.4em;text-align:right}
#mix .mu{width:26px;height:26px;display:grid;place-items:center;padding:0;background:transparent;border:1px solid var(--line);border-radius:50%;color:var(--ink);cursor:pointer;text-decoration:none}
#mix .mu:hover{border-color:var(--warm)}
#mix .mu:focus-visible,#mix .rst:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
#mix input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:24px;margin:0;background:transparent;cursor:pointer}
#mix input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--warm) var(--p,100%),rgba(244,236,220,.2) var(--p,100%))}
#mix input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--ink);border:2px solid var(--warm);box-shadow:0 1px 4px rgba(0,0,0,.5)}
#mix input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(244,236,220,.2)}
#mix input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--warm)}
#mix input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--warm)}
#mix input[type=range]:focus-visible{outline:none}
#mix input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(232,178,90,.45)}
#mix input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px rgba(232,178,90,.45)}
#mix .ft{display:flex;justify-content:flex-end;margin-top:2px}
#mix .rst{background:none;border:0;color:var(--mute);font:400 12px "Work Sans",system-ui,sans-serif;text-decoration:underline;cursor:pointer;padding:4px 2px}
#mix .rst:hover{color:var(--ink)}`;
document.head.appendChild(css);
const vl=$('#vl'),panel=document.createElement('div'),prev={};
panel.id='mix';panel.setAttribute('role','dialog');panel.setAttribute('aria-label','Volume');
panel.innerHTML='<h2>Volume</h2>'+ROWS.map(([k,l])=>`<div class="row" data-k="${k}"><div class="top"><button type="button" class="mu"></button><span>${l}</span><output></output></div><input type="range" min="0" max="100" step="1" aria-label="${l} volume"></div>`).join('')+'<div class="ft"><button type="button" class="rst">Reset</button></div>';
document.body.appendChild(panel);
vl.setAttribute('aria-haspopup','dialog');vl.setAttribute('aria-expanded','false');
const label=k=>ROWS.find(r=>r[0]===k)[1];
function paint(k){
  const row=panel.querySelector(`[data-k="${k}"]`),inp=row.querySelector('input'),v=Math.round(VOL[k]*100),m=v===0||(k==='master'&&!soundOn),b=row.querySelector('.mu');
  inp.value=v;inp.style.setProperty('--p',v+'%');inp.setAttribute('aria-valuetext',v+'%');
  row.querySelector('output').textContent=v+'%';row.classList.toggle('m',m);
  b.innerHTML=m?OFF:ON;b.setAttribute('aria-label',(m?'Unmute ':'Mute ')+label(k));
}
function apply(k){
  if(!A)return;const T=A.currentTime;
  if(k==='master'&&master)master.gain.setTargetAtTime(soundOn?VOL.master:0,T,.03);
  if(k==='music')musicApply();
  if(k==='sfx'&&sfxBus)sfxBus.gain.setTargetAtTime(VOL.sfx,T,.03);
  if(k==='amb'&&ambBus)ambBus.gain.setTargetAtTime(VOL.amb,T,.03);
}
const save=()=>{try{localStorage.setItem('jod_vol',JSON.stringify(VOL))}catch(_){}};
function setSound(on){soundOn=on;$('#snd').setAttribute('aria-pressed',on);apply('master');paint('master')}
panel.addEventListener('input',e=>{
  const inp=e.target.closest('input');if(!inp)return;
  const k=inp.closest('.row').dataset.k;VOL[k]=inp.value/100;
  if(k==='master'&&VOL.master>0&&!soundOn)setSound(true);
  paint(k);apply(k);save();
});
panel.addEventListener('change',e=>{const k=e.target.closest('.row')?.dataset.k;if(A&&soundOn&&(k==='sfx'||k==='master'))sfx.pop()});
panel.addEventListener('click',e=>{
  const b=e.target.closest('.mu');
  if(b){
    const k=b.closest('.row').dataset.k;
    if(k==='master'){
      if(!soundOn||VOL.master===0){if(VOL.master===0)VOL.master=prev.master||.8;setSound(true)}
      else setSound(false);
    }else if(VOL[k]>0){prev[k]=VOL[k];VOL[k]=0}
    else VOL[k]=prev[k]||.7;
    paint(k);apply(k);save();return;
  }
  if(e.target.closest('.rst')){
    Object.assign(VOL,{master:1,music:1,sfx:1,amb:1});setSound(true);
    ROWS.forEach(([k])=>{paint(k);apply(k)});save();
  }
});
function place(){
  const r=vl.getBoundingClientRect(),h=panel.offsetHeight,w=panel.offsetWidth;
  let top=r.top-h-8;if(top<8)top=Math.min(r.bottom+8,innerHeight-h-8);
  panel.style.top=Math.max(8,top)+'px';
  panel.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';
}
function open(kbd){ROWS.forEach(([k])=>paint(k));panel.classList.add('on');vl.setAttribute('aria-expanded','true');place();if(kbd)panel.querySelector('input').focus()}
function close(back){
  panel.classList.remove('on');vl.setAttribute('aria-expanded','false');
  if(panel.contains(document.activeElement))document.activeElement.blur();
  if(back)vl.focus();
}
vl.onclick=e=>{if(panel.classList.contains('on'))close(false);else open(e.detail===0);if(e.detail>0)vl.blur()};
panel.addEventListener('keydown',e=>{if(e.key==='Escape')close(true);e.stopPropagation()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('on'))close(false)});
document.addEventListener('pointerdown',e=>{if(panel.classList.contains('on')&&!panel.contains(e.target)&&!vl.contains(e.target))close(false)});
addEventListener('resize',()=>{if(panel.classList.contains('on'))place()});
$('#snd').onclick=()=>setSound(!soundOn);
ROWS.forEach(([k])=>paint(k));
})();
/* ---------- stage scaling (big text / TV) ---------- */
let K=1,BIG=true;
try{BIG=localStorage.getItem('jod_big')!=='0'}catch(_){}
function fit(){
  const fr=$('#frame'),bar=document.querySelector('.bar');
  const availW=Math.max(280,Math.min(document.documentElement.clientWidth-16,(innerHeight-(bar?bar.offsetHeight:40)-44)*16/9));
  const DW=Math.min(BIG?720:960,availW);K=availW/DW;
  fr.style.width=availW+'px';fr.style.height=(availW*9/16)+'px';
  stage.style.width=DW+'px';stage.style.height=(DW*9/16)+'px';stage.style.transform=`scale(${K})`;
}
$('#bg').setAttribute('aria-pressed',BIG);
$('#bg').onclick=e=>{BIG=!BIG;e.currentTarget.setAttribute('aria-pressed',BIG);try{localStorage.setItem('jod_big',BIG?'1':'0')}catch(_){}fit();e.currentTarget.blur()};
$('#fsb').onclick=e=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{});e.currentTarget.blur()};
addEventListener('resize',fit);document.addEventListener('fullscreenchange',()=>setTimeout(fit,60));
fit();
$('#cc').onclick=e=>{const p=e.target.getAttribute('aria-pressed')==='true';e.target.setAttribute('aria-pressed',!p);applyCC()};
</script>
